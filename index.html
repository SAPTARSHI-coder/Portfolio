<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saptarshi Sadhu</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000000;
            height: 100vh;
            display: flex;
            align-items: flex-start;
            justify-content: flex-end;
            font-family: sans-serif;
            overflow: hidden;
        }

        .switch-wrapper {
            margin: 30px;
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: #aaaaaa;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .switch-wrapper:hover {
            color: #ffffff;
        }

        .switch-text {
            font-size: 16px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .switch {
            position: relative;
            width: 60px;
            height: 30px;
            background-color: #444444;
            border-radius: 30px;
            transition: background-color 0.3s ease;
        }

        .switch::before {
            content: "";
            position: absolute;
            height: 22px;
            width: 22px;
            left: 4px; /* OFF position */
            bottom: 4px;
            background-color: #ffffff;
            border-radius: 50%;
            transition: transform 0.3s ease;
        }

        .switch-wrapper:hover .switch {
            background-color: #666666;
        }

        @media (max-width: 480px) {
            .switch-wrapper {
                margin: 15px;
                transform: scale(0.85); /* Shorter/smaller for mobile */
                transform-origin: top right;
            }
        }
    </style>
</head>
<body>

    <a href="3d.html" class="switch-wrapper">
        <span class="switch-text">Static Mode</span>
        <div class="switch"></div>
    </a>

</body>
</html>
